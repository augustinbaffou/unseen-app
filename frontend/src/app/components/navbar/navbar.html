<nav class="bg-gradient-to-r from-yellow-50 to-yellow-100 shadow-lg border-b border-yellow-200">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <!-- Logo et titre -->
      <div class="flex items-center space-x-4">
        <div class="flex-shrink-0">
          <h1 class="text-2xl font-bold text-lime-900 tracking-tight">
            🍺 Unseen
          </h1>
        </div>
        <div class="hidden md:block">
          <p class="text-lime-800 text-sm font-medium">
            Votre guide des bars de Nantes
          </p>
        </div>
      </div>

      <!-- Contrôles droite -->
      <div class="flex items-center gap-2">

        <!-- Toggle dark mode -->
        <button
          (click)="themeService.toggle()"
          [attr.aria-label]="themeService.isDark() ? 'Activer le mode clair' : 'Activer le mode sombre'"
          class="w-9 h-9 flex items-center justify-center rounded-lg border border-gray-200 bg-white hover:bg-gray-50 transition-colors"
        >
          <!-- Icône Soleil (mode clair actif) -->
          @if (!themeService.isDark()) {
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"/>
            </svg>
          }
          <!-- Icône Lune (mode sombre actif) -->
          @if (themeService.isDark()) {
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z"/>
            </svg>
          }
        </button>

      <!-- Toggle des marqueurs (ancien conteneur) -->
        <!-- Si l'utilisateur n'est pas connecté -->
        <button
          *ngIf="!(currentUser$ | async)"
          (click)="loginWithGoogle()"
          class="flex items-center gap-2 bg-white hover:bg-gray-50 text-gray-700 font-semibold py-2 px-4 border border-gray-300 rounded-lg shadow-sm transition-colors duration-200"
        >
          <svg class="w-5 h-5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Se connecter avec Google
        </button>

        <!-- Si l'utilisateur est connecté -->
        <div *ngIf="currentUser$ | async as user" class="flex items-center gap-4">
          <div class="flex items-center gap-3">
            <img
              *ngIf="user.picture"
              [src]="user.picture"
              [alt]="user.name"
              class="w-8 h-8 rounded-full border-2 border-gray-200"
            />
            <span class="text-gray-700 font-medium">{{ user.name }}</span>
          </div>
          <button
            (click)="logout()"
            class="bg-red-500 hover:bg-red-600 text-white font-semibold py-2 px-4 rounded-lg transition-colors duration-200"
          >
            Se déconnecter
          </button>
        </div>
      </div>
    </div>
  </div>
</nav>
